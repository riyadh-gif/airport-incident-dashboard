# Airport Incident Dashboard — container stack
#
#   app    : PHP 8.3-FPM + nginx (built from the multi-stage Dockerfile)
#   mysql  : MySQL 8 for production-style persistence
#
# Quick start:
#   docker compose up --build
#   open http://localhost:8080
#
# The app waits for MySQL, runs migrations on boot, and (with SEED_ON_START=true)
# seeds the demo admin/operator accounts and synthetic data.
#
# SQLite remains the zero-config local default outside of Docker — see README.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: airport-incident-dashboard:latest
    container_name: aid_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Airport Incident Dashboard"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      # Provide a real key in production: `php artisan key:generate --show`
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: airport_incidents
      DB_USERNAME: airport
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      # Set to true on the very first boot to load demo data, then back to false.
      SEED_ON_START: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aid_net

  mysql:
    image: mysql:8.0
    container_name: aid_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airport_incidents
      MYSQL_USER: airport
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      # Exposed for local inspection only; remove in production.
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aid_net

volumes:
  mysql_data:

networks:
  aid_net:
    driver: bridge
